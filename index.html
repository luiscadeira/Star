<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <title>Star Studio Car</title>
    <!-- Importação de fonte para melhor design -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pwa-styles.css">
    <style>
        /* Ajustes finos de CSS para o novo design */
        :root { --accent: #f59e0b; --bg-card: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; }
        .tab-content { display: none; padding: 10px; }
        .tab-content.active { display: block; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; }
        .btn { cursor: pointer; border: none; border-radius: 10px; padding: 12px; font-weight: 700; transition: 0.2s; }
        .history-list { margin-top: 15px; }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; display: none; z-index: 1000; font-weight: 700; }
    </style>
</head>

<body>

    <div id="toast">Copiado!</div>
    <div class="bg"></div>

    <header style="text-align:center; padding: 20px;">
        <img src="logo.png" alt="Logo STAR STUDIO CAR" style="max-width: 150px;">
        <br>
        <span class="badge" style="background: var(--accent); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800;">ESTÉTICA AUTOMOTIVA</span>
    </header>

    <div class="container">
        <nav class="nav-tabs" style="display:flex; justify-content:space-around; background: #111; padding: 10px; position: sticky; top: 0; z-index: 100;">
            <div class="tab-highlight"></div>
            <button class="tab-btn active" onclick="openTab('semanal', this)">AGENDA</button>
            <button class="tab-btn" onclick="openTab('individual', this)">SERVIÇOS</button>
            <button class="tab-btn" onclick="openTab('historico', this)">AVISOS</button>
            <button class="tab-btn" onclick="openTab('config', this)">CONFIG</button>
        </nav>

        <!-- ABA 1: AGENDA -->
        <div id="semanal" class="tab-content active">
            <div class="glass-card">
                <div class="section-title">📅 Período da Semana</div>
                <input type="date" id="mondayDate" onchange="atualizarSemana()">
                <div id="dayGrid"></div>
                <button class="btn" style="background:#ff4757; color:white; width:100%; margin-top:10px;" onclick="resetarAgendaParaAberta()">🔄 Resetar Toda Semana</button>
            </div>
            <div class="glass-card">
                <textarea id="outputSemanal" readonly style="height: 150px;"></textarea>
                <div style="display:flex; gap:10px;">
                    <button class="btn" style="flex:1; background:#444; color:#fff;" onclick="copiar('outputSemanal')">📋 Copiar Lista</button>
                    <button class="btn" style="flex:1; background:var(--accent); color:#000;" onclick="copiarStatusSemanal()">📅 Status</button>
                </div>
            </div>
        </div>

        <!-- ABA 2: NOVO SERVIÇO -->
        <div id="individual" class="tab-content">
            <div class="glass-card">
                <div class="section-title">👤 Cliente & Veículo</div>
                <input type="text" id="clientName" placeholder="NOME DO CLIENTE">
                <input type="text" id="carInfo" placeholder="VEÍCULO / PLACA (Ex: FIESTA - ABC1234)" oninput="buscarHistorico(this.value)">
                <div style="display:flex; gap:10px">
                    <input type="date" id="serviceDate">
                    <input type="time" id="serviceTime">
                </div>
            </div>

            <div class="glass-card">
                <div class="section-title">🛠 Serviços</div>
                <div class="services-grid" id="servicesGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
            </div>

            <div class="glass-card">
                <div class="section-title">⚠️ Vistoria</div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <label><input type="checkbox" class="insp" value="Riscos"> ✴️ Riscos</label>
                    <label><input type="checkbox" class="insp" value="Amassados"> 🛠️ Amassados</label>
                </div>
                <input type="text" id="linkFotos" placeholder="Link das Fotos (Opcional)">
            </div>

            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                    <span style="font-weight:700;">TOTAL</span>
                    <span id="totalValue" style="color:var(--accent); font-size: 1.5rem; font-weight: 800;">R$ 0,00</span>
                </div>
                <textarea id="outputIndividual" readonly style="height: 100px; font-size: 0.8rem; opacity: 0.7;"></textarea>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="btn" style="flex:1; background:#444; color:#fff;" onclick="copiarIndividual()">📋 Copiar & Salvar</button>
                    <button class="btn" style="flex:1; background:var(--accent); color:#000;" onclick="limparCampos()">🔄 Limpar</button>
                </div>
            </div>
        </div>

        <!-- ABA 3: AVISOS (HISTÓRICO) -->
        <div id="historico" class="tab-content">
            <div class="glass-card">
                <div class="section-title" style="font-weight:800; font-size:1.2rem; margin-bottom:20px;">📋 ÚLTIMOS SERVIÇOS</div>
                
                <!-- Busca -->
                <div style="position: relative; margin-bottom: 20px;">
                    <input type="text" id="inputBusca" placeholder="Buscar por nome ou placa..." 
                        oninput="carregarAbaHistorico()" 
                        style="padding-left: 40px; background: rgba(255,255,255,0.05); border-radius: 15px;">
                    <span style="position: absolute; left: 15px; top: 12px; opacity: 0.5;">🔍</span>
                </div>

                <div id="listaHistorico" class="history-list"></div>

                <button class="btn" style="width:100%; background:#222; color:#ef4444; margin-top:20px;" onclick="limparHistoricoTotal()">🗑️ Apagar Todo Histórico</button>
            </div>
        </div>

        <!-- ABA 4: CONFIG -->
        <div id="config" class="tab-content">
            <div class="glass-card">
                <div class="section-title">⚙️ Configurações de Serviços</div>
                <div id="configServices"></div>
                <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
                <form id="serviceForm">
                    <input type="text" id="newServiceName" placeholder="Nome do Serviço" required>
                    <input type="text" id="newServicePrice" placeholder="Preço (Ex: 60,00)" required>
                    <button type="submit" class="btn" style="width:100%; background:var(--accent); color:#000;">+ Adicionar Serviço</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Botão Fixo WhatsApp -->
    <div class="fixed-action" id="whatsappAction" style="display:none; position: fixed; bottom: 20px; width: 100%; padding: 0 20px; box-sizing: border-box; z-index: 999;">
        <button class="btn" style="width:100%; background:#25D366; color:#fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4);" onclick="enviarWhatsApp()">📲 ENVIAR PARA WHATSAPP</button>
    </div>

    <script>
        const MAP_LINK = "https://maps.app.goo.gl/KPY28spUTp2C3Xp58";
        const dias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            initAgenda();
            renderServicesGrid();
            document.getElementById('serviceDate').value = new Date().toISOString().split('T')[0];
        };

        function openTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if (id === 'historico') carregarAbaHistorico();
            if (id === 'config') renderConfigServices();
            document.getElementById('whatsappAction').style.display = (id === 'individual') ? 'block' : 'none';
        }

        // --- LÓGICA DE SALVAMENTO ---
        function salvarNoHistorico() {
            const nome = document.getElementById('clientName').value.trim();
            const placa = document.getElementById('carInfo').value.trim().toUpperCase();
            const dataServico = document.getElementById('serviceDate').value;
            const horaServico = document.getElementById('serviceTime').value;
            
            const servicos = Array.from(document.querySelectorAll('.svc:checked')).map(c => ({
                nome: c.value,
                preco: parseFloat(c.dataset.price) || 0
            }));

            if (!nome || !placa || servicos.length === 0) return;

            let dataFormatada = dataServico ? dataServico.split('-').reverse().join('/') : new Date().toLocaleDateString('pt-BR');
            let historico = JSON.parse(localStorage.getItem('star_history') || '[]');
            
            // Evitar duplicatas no mesmo dia
            if (historico.length > 0 && historico[0].placa === placa && historico[0].data === dataFormatada) {
                historico[0] = { placa, nome, servicos, data: dataFormatada, hora: horaServico };
            } else {
                historico.unshift({ placa, nome, servicos, data: dataFormatada, hora: horaServico });
            }

            localStorage.setItem('star_history', JSON.stringify(historico.slice(0, 100)));
        }

        function carregarAbaHistorico() {
            const lista = document.getElementById('listaHistorico');
            const busca = (document.getElementById('inputBusca')?.value || "").toLowerCase();
            const historico = JSON.parse(localStorage.getItem('star_history') || '[]');
            
            if (historico.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#666; padding:20px;">Histórico vazio.</p>';
                return;
            }

            const filtrados = historico.filter(h => (h.nome||"").toLowerCase().includes(busca) || (h.placa||"").toLowerCase().includes(busca));

            const agrupado = filtrados.reduce((acc, item) => {
                const d = item.data || 'Sem data';
                if (!acc[d]) acc[d] = [];
                acc[d].push(item);
                return acc;
            }, {});

            let html = '';
            for (const [data, itens] of Object.entries(agrupado)) {
                const totalDia = itens.reduce((acc, h) => acc + h.servicos.reduce((s, serv) => s + serv.preco, 0), 0);
                
                html += `
                    <div style="margin-bottom: 25px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <span style="color:#f59e0b; font-size:0.75rem; font-weight:800; text-transform:uppercase;">${data}</span>
                            <span style="background:rgba(245,158,11,0.1); color:#f59e0b; padding:2px 8px; border-radius:6px; font-size:0.8rem; font-weight:800;">Total: R$ ${totalDia.toFixed(2).replace('.', ',')}</span>
                        </div>
                `;

                itens.forEach(h => {
                    const idx = historico.indexOf(h);
                    html += `
                        <div style="padding:18px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:16px; margin-bottom:12px; position:relative;">
                            <button onclick="deletarDoHistorico(${idx})" style="position:absolute; top:15px; right:15px; background:none; border:none; color:#444; cursor:pointer;">🗑️</button>
                            <div style="font-weight:800; font-size:1.1rem; color:#fff; margin-bottom:4px;">${h.nome.toUpperCase()} - ${h.placa}</div>
                            <div style="font-size:0.85rem; color:#888; margin-bottom:12px;">🕒 ${h.hora || '--:--'} | <span style="color:#10b981;">agendado</span></div>
                            <div style="border-top:1px solid rgba(255,255,255,0.05); padding-top:10px; margin-bottom:15px;">
                                ${h.servicos.map(s => `
                                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                        <span style="color:#ccc; font-size:0.9rem;">• ${s.nome}</span>
                                        <span style="color:#f59e0b; font-weight:700;">R$ ${s.preco.toFixed(2).replace('.', ',')}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="enviarProntoWhatsApp('${h.nome}', '${h.placa}')" style="width:100%; padding:12px; background:#10b981; color:white; border:none; border-radius:10px; font-weight:700; cursor:pointer;">✉ AVISAR PRONTO</button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            lista.innerHTML = html || '<p style="text-align:center; color:#666;">Nenhum resultado.</p>';
        }

        // --- WHATSAPP E COPIAR ---
        function enviarWhatsApp() {
            salvarNoHistorico();
            const txt = document.getElementById('outputIndividual').value;
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
        }

        function copiarIndividual() {
            salvarNoHistorico();
            const el = document.getElementById('outputIndividual');
            el.select();
            document.execCommand('copy');
            showToast("Copiado e Salvo!");
        }

        function enviarProntoWhatsApp(nome, placa) {
            const txt = `Seu carro está pronto, *${nome}*! ✨🚗\n\nFinalizamos os serviços no seu *${placa}*!\n\nO veículo já está disponível para retirada.\n\n📍 *Localização:* ${MAP_LINK}\n\nLuis – *STAR STUDIO CAR* 🚗✨`;
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
        }

        // --- CONFIGURAÇÕES DE SERVIÇOS ---
        const DEFAULT_SERVICES = [
            { id: 's1', name: 'Lavagem Comercial', price: 60, icon: '🧼' },
            { id: 's2', name: 'Lavagem Detalhada', price: 185, icon: '✨' },
            { id: 's3', name: 'Higienização de Banco', price: 185, icon: '🪑' }
        ];

        async function renderServicesGrid() {
            const services = JSON.parse(localStorage.getItem('star_services') || JSON.stringify(DEFAULT_SERVICES));
            document.getElementById('servicesGrid').innerHTML = services.map(s => `
                <label style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; display:flex; align-items:center; gap:10px; cursor:pointer;">
                    <input type="checkbox" class="svc" data-price="${s.price}" value="${s.name}" onchange="gerarMensagemIndividual()">
                    <div style="font-size:0.8rem;">
                        <strong>${s.name}</strong><br>
                        <span style="color:var(--accent)">R$ ${s.price.toFixed(2)}</span>
                    </div>
                </label>
            `).join('');
        }

        document.getElementById('serviceForm').onsubmit = (e) => {
            e.preventDefault();
            const nome = document.getElementById('newServiceName').value;
            const preco = parseFloat(document.getElementById('newServicePrice').value.replace(',', '.'));
            if (isNaN(preco)) return alert("Preço inválido");
            const services = JSON.parse(localStorage.getItem('star_services') || JSON.stringify(DEFAULT_SERVICES));
            services.push({ id: 's'+Date.now(), name: nome, price: preco, icon: '🔧' });
            localStorage.setItem('star_services', JSON.stringify(services));
            renderServicesGrid(); renderConfigServices();
            e.target.reset();
        };

        // --- AUXILIARES ---
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function deletarDoHistorico(idx) {
            if (!confirm("Excluir registro?")) return;
            let h = JSON.parse(localStorage.getItem('star_history') || '[]');
            h.splice(idx, 1);
            localStorage.setItem('star_history', JSON.stringify(h));
            carregarAbaHistorico();
        }

        function limparHistoricoTotal() {
            if (confirm("Apagar TUDO?")) { localStorage.removeItem('star_history'); carregarAbaHistorico(); }
        }

        function buscarHistorico(placa) {
            gerarMensagemIndividual();
            if (placa.length < 3) return;
            const h = JSON.parse(localStorage.getItem('star_history') || '[]');
            const found = h.find(item => item.placa.includes(placa.toUpperCase()));
            if (found) document.getElementById('clientName').value = found.nome;
        }

        function limparCampos() {
            document.getElementById('clientName').value = "";
            document.getElementById('carInfo').value = "";
            document.querySelectorAll('.svc, .insp').forEach(c => c.checked = false);
            gerarMensagemIndividual();
        }

        function initAgenda() {
            const grid = document.getElementById('dayGrid');
            grid.innerHTML = dias.map((dia, i) => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #222;">
                    <div><span id="date-${i}" style="font-size:0.7rem; color:#666;">--/--</span><br><strong>${dia}</strong></div>
                    <select id="status-${i}" onchange="salvarAgendaManual()" style="width:130px; margin:0;">
                        <option value="Aberta ✅">Aberta ✅</option>
                        <option value="*Reservado* ❌">Reservado ❌</option>
                        <option value="*A confirmar* ⏳">Confirmar ⏳</option>
                    </select>
                </div>`).join('');
            const dataSalva = localStorage.getItem('star_agenda_data');
            if (dataSalva) document.getElementById('mondayDate').value = dataSalva;
            else {
                const d = new Date(); d.setDate(d.getDate() + (1 - d.getDay() + 7) % 7);
                document.getElementById('mondayDate').value = d.toISOString().split('T')[0];
            }
            const statusSalvo = JSON.parse(localStorage.getItem('star_agenda_status'));
            if (statusSalvo) statusSalvo.forEach((s, i) => document.getElementById(`status-${i}`).value = s);
            atualizarSemana();
        }

        function atualizarSemana() {
            const dataInput = document.getElementById('mondayDate').value;
            if (!dataInput) return;
            let base = new Date(dataInput + 'T12:00:00');
            let texto = "";
            dias.forEach((dia, i) => {
                const d = new Date(base); d.setDate(base.getDate() + i);
                const df = d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
                document.getElementById(`date-${i}`).innerText = df;
                texto += `📝 *${dia} (${df})* – ${document.getElementById(`status-${i}`).value}\n`;
            });
            document.getElementById('outputSemanal').value = `📢 *AGENDA DA SEMANA*\n\nOlá! 👋 Horários disponíveis:\n\n${texto}\n*STAR STUDIO CAR* 🚗✨`;
        }

        function salvarAgendaManual() {
            const status = Array.from({length:7}, (_,i) => document.getElementById(`status-${i}`).value);
            localStorage.setItem('star_agenda_status', JSON.stringify(status));
            localStorage.setItem('star_agenda_data', document.getElementById('mondayDate').value);
            atualizarSemana();
        }

        function copiar(id) {
            const el = document.getElementById(id); el.select(); document.execCommand('copy'); showToast("Copiado!");
        }
    </script>
</body>
</html>
