<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <title>Star Studio Car</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pwa-styles.css">
    <style>
        /* Ajustes rápidos de layout para garantir o visual */
        :root { --accent: #f59e0b; --bg-dark: #121212; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: white; margin: 0; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-size: cover; background-position: center; transition: 0.5s; filter: brightness(0.4); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .nav-tabs { display: flex; gap: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 12px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; }
        .tab-btn { flex: 1; border: none; background: none; color: #888; padding: 10px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; }
        .tab-btn.active { color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .service-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid transparent; }
        .service-item input { width: auto; margin: 0; }
        .total-display { font-size: 1.5rem; font-weight: bold; text-align: center; color: var(--accent); margin: 15px 0; }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: black; padding: 10px 20px; border-radius: 20px; display: none; z-index: 1000; }
        .history-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; position: relative; }
        .btn-ready { background: #2ecc71; color: white; margin-top: 10px; }
        .config-card { border-bottom: 1px solid #333; padding: 15px 0; }
    </style>
</head>
<body>

    <div id="toast">Copiado!</div>
    <div class="bg"></div>

    <header style="text-align: center; padding: 20px;">
        <img src="logo.png" alt="Logo" style="max-width: 150px;">
        <div style="color: var(--accent); font-weight: bold; letter-spacing: 2px; margin-top: 5px;">ESTÉTICA AUTOMOTIVA</div>
    </header>

    <div class="container">
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="openTab('semanal', this)">AGENDA</button>
            <button class="tab-btn" onclick="openTab('individual', this)">SERVIÇOS</button>
            <button class="tab-btn" onclick="openTab('historico', this)">AVISOS</button>
            <button class="tab-btn" onclick="openTab('config', this)">CONFIG</button>
        </nav>

        <!-- ABA 1: AGENDA -->
        <div id="semanal" class="tab-content active">
            <div class="glass-card">
                <div class="section-title">📅 Período da Semana</div>
                <input type="date" id="mondayDate" onchange="atualizarSemana()">
                <div id="dayGrid"></div>
                <button class="btn" style="background:#ff4757; color:white; margin-top:10px;" onclick="resetarAgendaParaAberta()">🔄 Resetar Toda Semana</button>
            </div>
            <div class="glass-card">
                <textarea id="outputSemanal" rows="8" readonly></textarea>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="btn" style="background:var(--accent);" onclick="copiar('outputSemanal')">📋 Copiar Lista</button>
                </div>
            </div>
        </div>

        <!-- ABA 2: NOVO SERVIÇO -->
        <div id="individual" class="tab-content">
            <div class="glass-card">
                <div class="section-title">👤 Cliente & Veículo</div>
                <input type="text" id="clientName" placeholder="NOME DO CLIENTE">
                <input type="text" id="carInfo" placeholder="VEÍCULO / PLACA" oninput="buscarHistorico(this.value)">
                <div style="display:flex; gap:10px">
                    <input type="date" id="serviceDate" onchange="gerarMensagemIndividual()">
                    <input type="time" id="serviceTime" onchange="gerarMensagemIndividual()">
                </div>
            </div>

            <div class="glass-card">
                <div class="section-title">🛠 Serviços</div>
                <div class="services-grid" id="servicesGrid"></div>
            </div>

            <div class="glass-card">
                <div class="section-title">⚠️ Vistoria</div>
                <div class="services-grid">
                    <label class="service-item"><input type="checkbox" class="insp" value="Riscos na pintura" onchange="gerarMensagemIndividual()"> ✴️ Riscos</label>
                    <label class="service-item"><input type="checkbox" class="insp" value="Amassados" onchange="gerarMensagemIndividual()"> 🛠️ Amassados</label>
                </div>
                <input type="text" id="linkFotos" placeholder="Link das Fotos (Opcional)" oninput="gerarMensagemIndividual()">
            </div>

            <div class="glass-card">
                <div id="totalDisplay" class="total-display">R$ 0,00</div>
                <textarea id="outputIndividual" rows="8" readonly></textarea>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="btn" style="background:#25d366; color:white" onclick="enviarWhatsApp()">📲 Enviar WhatsApp</button>
                    <button class="btn" style="background:#444; color:white" onclick="limparCampos()">🔄 Limpar</button>
                </div>
            </div>
        </div>

        <!-- ABA 3: HISTÓRICO -->
        <div id="historico" class="tab-content">
            <div class="glass-card">
                <div id="listaHistorico"></div>
                <button class="btn" style="background:rgba(255,71,87,0.2); color:#ff4757; margin-top:20px" onclick="limparHistoricoTotal()">🗑️ Apagar Tudo</button>
            </div>
        </div>

        <!-- ABA 4: CONFIGURAÇÕES -->
        <div id="config" class="tab-content">
            <div class="glass-card">
                <h3>Novo Serviço</h3>
                <input type="text" id="newServiceName" placeholder="Nome do Serviço">
                <input type="number" id="newServicePrice" placeholder="Preço (ex: 150)">
                <button class="btn" style="background:var(--accent)" onclick="addNewService()">💾 Adicionar</button>
            </div>
            <div id="configServices" class="glass-card"></div>
        </div>
    </div>

    <script>
        const MAP_LINK = "https://maps.app.goo.gl/KPY28spUTp2C3Xp58";
        const dias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
        
        // --- INICIALIZAÇÃO ÚNICA ---
        async function initApp() {
            // Setup Agenda
            const grid = document.getElementById('dayGrid');
            if (grid) {
                grid.innerHTML = dias.map((dia, i) => `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
                        <div><small id="date-${i}" style="color:var(--accent)">--/--</small><br><b>${dia}</b></div>
                        <select id="status-${i}" onchange="salvarAgendaManual()" style="width:150px">
                            <option value="Aberta ✅">Aberta ✅</option>
                            <option value="*Reservado* ❌">Reservado ❌</option>
                            <option value="*A confirmar* ⏳">Confirmar ⏳</option>
                        </select>
                    </div>`).join('');
            }

            carregarAgendaSalva();
            await renderServicesGrid();
            await renderConfigServices();
            
            // Data de hoje
            document.getElementById('serviceDate').value = new Date().toISOString().split('T')[0];
            setBackground('semanal');
        }

        // --- ABA E VISUAL ---
        function openTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            setBackground(id);
            if(id === 'historico') carregarAbaHistorico();
            if(id === 'config') renderConfigServices();
        }

        function setBackground(id) {
            const urls = {
                semanal: "https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?w=800",
                individual: "https://images.unsplash.com/photo-1607860108855-64acf2078ed9?w=800",
                historico: "https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=800",
                config: "https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=800"
            };
            document.querySelector('.bg').style.backgroundImage = `url(${urls[id]})`;
        }

        // --- SERVIÇOS (LOCALSTORAGE) ---
        const DEFAULT_SERVICES = [
            { id: '1', name: 'Lavagem Comercial', price: 60, icon: '🧼' },
            { id: '2', name: 'Lavagem Detalhada', price: 185, icon: '✨' }
        ];

        function getServices() {
            const s = localStorage.getItem('star_services');
            return s ? JSON.parse(s) : DEFAULT_SERVICES;
        }

        function saveServices(arr) {
            localStorage.setItem('star_services', JSON.stringify(arr));
        }

        async function renderServicesGrid() {
            const services = getServices();
            const container = document.getElementById('servicesGrid');
            if (!container) return;
            container.innerHTML = services.map(s => `
                <label class="service-item">
                    <input type="checkbox" class="svc" data-price="${s.price}" value="${s.name}" onchange="gerarMensagemIndividual()">
                    <div>${s.icon || '🚗'} <b>${s.name}</b><br><small>R$ ${s.price}</small></div>
                </label>
            `).join('');
        }

        async function renderConfigServices() {
            const services = getServices();
            const container = document.getElementById('configServices');
            if (!container) return;
            container.innerHTML = '<h3>Serviços Atuais</h3>' + services.map(s => `
                <div class="config-card">
                    <b>${s.name}</b> - R$ ${s.price}
                    <button onclick="deleteService('${s.id}')" style="float:right; background:none; border:none; color:red; cursor:pointer">🗑️</button>
                </div>
            `).join('');
        }

        function addNewService() {
            const name = document.getElementById('newServiceName').value;
            const price = document.getElementById('newServicePrice').value;
            if(!name || !price) return alert("Preencha nome e preço");

            const services = getServices();
            services.push({ id: Date.now().toString(), name, price: parseFloat(price), icon: '🔧' });
            saveServices(services);
            
            document.getElementById('newServiceName').value = '';
            document.getElementById('newServicePrice').value = '';
            
            renderServicesGrid();
            renderConfigServices();
            showToast("Serviço adicionado!");
        }

        function deleteService(id) {
            if(!confirm("Excluir serviço?")) return;
            let services = getServices();
            services = services.filter(s => s.id !== id);
            saveServices(services);
            renderServicesGrid();
            renderConfigServices();
        }

        // --- MENSAGENS E WHATSAPP ---
        function gerarMensagemIndividual() {
            const nome = document.getElementById('clientName').value || "Cliente";
            const carro = document.getElementById('carInfo').value || "Veículo";
            const dataRaw = document.getElementById('serviceDate').value;
            const hora = document.getElementById('serviceTime').value || "00:00";
            let dataF = dataRaw ? dataRaw.split('-').reverse().join('/') : "--/--/--";

            let total = 0;
            const selecionados = Array.from(document.querySelectorAll('.svc:checked')).map(c => {
                total += parseFloat(c.dataset.price);
                return `• ${c.value}`;
            });

            const danos = Array.from(document.querySelectorAll('.insp:checked')).map(c => c.value);
            document.getElementById('totalDisplay').innerText = `R$ ${total.toFixed(2)}`;

            let texto = `Olá, *${nome}*! 👋\n\nConfirmamos seu agendamento na *STAR STUDIO CAR* ✅\n\n🚗 *Veículo:* ${carro}\n🗓 *Data:* ${dataF}\n⏰ *Horário:* ${hora}\n\n🛠 *Serviços:*\n${selecionados.join('\n') || '• A definir'}\n\n💰 *Valor Total:* R$ ${total.toFixed(2)}\n`;
            if (danos.length > 0) texto += `\n⚠️ *Vistoria:* ${danos.join(', ')}.\n`;
            texto += `\n📍 *Localização:* ${MAP_LINK}\n\nLuis – *STAR STUDIO CAR* 🚗✨`;

            document.getElementById('outputIndividual').value = texto;
        }

        function enviarWhatsApp() {
            const texto = document.getElementById('outputIndividual').value;
            salvarNoHistorico();
            window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
        }

        // --- HISTÓRICO ---
        function salvarNoHistorico() {
            const placa = document.getElementById('carInfo').value.toUpperCase();
            const nome = document.getElementById('clientName').value;
            const total = document.getElementById('totalDisplay').innerText;
            if (!placa || !nome) return;

            let historico = JSON.parse(localStorage.getItem('star_history') || '[]');
            historico.unshift({ placa, nome, total, data: new Date().toLocaleDateString('pt-BR') });
            localStorage.setItem('star_history', JSON.stringify(historico.slice(0, 30)));
        }

        function carregarAbaHistorico() {
            const lista = document.getElementById('listaHistorico');
            const historico = JSON.parse(localStorage.getItem('star_history') || '[]');
            lista.innerHTML = historico.map((h, i) => `
                <div class="history-item">
                    <b>${h.placa}</b> - ${h.nome}<br>
                    <small>${h.data} | ${h.total}</small>
                    <button class="btn btn-ready" onclick="avisarPronto('${h.nome}', '${h.placa}')">✅ Avisar que está Pronto</button>
                </div>
            `).join('') || 'Sem histórico';
        }

        function avisarPronto(nome, placa) {
            const msg = `Seu carro está pronto, *${nome}*! ✨🚗\n\nFinalizamos os serviços no seu *${placa}* e ele já pode ser retirado.\n\n📍 *Localização:* ${MAP_LINK}\n\nLuis – *STAR STUDIO CAR* 🚗✨`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function buscarHistorico(placa) {
            if(placa.length < 3) return;
            const historico = JSON.parse(localStorage.getItem('star_history') || '[]');
            const cliente = historico.find(h => h.placa.includes(placa.toUpperCase()));
            if(cliente) document.getElementById('clientName').value = cliente.nome;
            gerarMensagemIndividual();
        }

        // --- AGENDA ---
        function salvarAgendaManual() {
            const status = [];
            for (let i = 0; i < 7; i++) status.push(document.getElementById(`status-${i}`).value);
            localStorage.setItem('star_agenda_status', JSON.stringify(status));
            localStorage.setItem('star_agenda_data', document.getElementById('mondayDate').value);
            atualizarSemana();
        }

        function carregarAgendaSalva() {
            const dataS = localStorage.getItem('star_agenda_data');
            const statusS = JSON.parse(localStorage.getItem('star_agenda_status'));
            if(dataS) document.getElementById('mondayDate').value = dataS;
            else {
                const d = new Date();
                d.setDate(d.getDate() + (1 - d.getDay() + 7) % 7); // Próxima segunda
                document.getElementById('mondayDate').value = d.toISOString().split('T')[0];
            }
            if(statusS) statusS.forEach((s, i) => { if(document.getElementById(`status-${i}`)) document.getElementById(`status-${i}`).value = s; });
            atualizarSemana();
        }

        function atualizarSemana() {
            const base = new Date(document.getElementById('mondayDate').value + 'T12:00:00');
            let texto = "📢 *AGENDA DA SEMANA*\n\n";
            dias.forEach((dia, i) => {
                const d = new Date(base); d.setDate(base.getDate() + i);
                const dataF = d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0');
                document.getElementById(`date-${i}`).innerText = dataF;
                texto += `📝 *${dia} (${dataF})* – ${document.getElementById(`status-${i}`).value}\n`;
            });
            document.getElementById('outputSemanal').value = texto + "\n*STAR STUDIO CAR* 🚗✨";
        }

        function resetarAgendaParaAberta() {
            if(!confirm("Abrir todos os horários?")) return;
            for(let i=0; i<7; i++) document.getElementById(`status-${i}`).value = "Aberta ✅";
            salvarAgendaManual();
        }

        // --- AUXILIARES ---
        function copiar(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            showToast("Copiado!");
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function limparCampos() {
            document.getElementById('clientName').value = "";
            document.getElementById('carInfo').value = "";
            document.querySelectorAll('.svc, .insp').forEach(c => c.checked = false);
            gerarMensagemIndividual();
        }

        function limparHistoricoTotal() {
            if(confirm("Limpar histórico?")) { localStorage.removeItem('star_history'); carregarAbaHistorico(); }
        }

        window.onload = initApp;
    </script>
</body>
</html>
